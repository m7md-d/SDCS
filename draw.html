<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drone Joystick Live Sketch</title>

<style>
  /* ---------- Theme colours (light by default, dark via system setting) ---------- */
  :root {
    --bg:   #f6f7f9;
    --card: #ffffff;
    --fg:   #1a1d23;
    --muted:#6b7280;
    --line: #d8dce3;
    --right-stick: #2563eb;   /* pen colour for rx,ry */
    --left-stick:  #e11d48;   /* pen colour for lx,ly */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:   #0f1115;
      --card: #181b22;
      --fg:   #e8eaee;
      --muted:#9aa1ae;
      --line: #2c313c;
      --right-stick: #60a5fa;
      --left-stick:  #fb7185;
    }
  }

  /* ---------- Layout ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1   { font-size: 20px; margin: 0 0 12px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
  }

  /* ---------- Drawing canvas ---------- */
  #sketch {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    max-height: 70vh;
    margin: 0 auto;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  /* ---------- Controls ---------- */
  button, select {
    font: inherit;
    border: 0;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    background: var(--right-stick);
    color: #fff;
  }
  button.secondary {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--line);
  }
  select, input[type="number"], input[type="text"], textarea {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px;
  }
  select { padding: 6px; }
  input[type="number"] { width: 80px; }
  input[type="text"]   { width: 190px; }
  textarea {
    width: 100%;
    height: 100px;
    padding: 8px;
    border-radius: 8px;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
  }
  label { color: var(--muted); font-size: 13px; }
  .mono { font: 13px ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>

<body>
<main>
  <h1>🚁 Drone Joystick Live Sketch</h1>

  <!-- ===== Drawing area + playback controls ===== -->
  <div class="card">
    <canvas id="sketch" width="700" height="700"></canvas>

    <div class="row">
      <button id="playBtn">Pause</button>
      <button id="restartBtn" class="secondary">Restart</button>
      <button id="drawAllBtn" class="secondary">Draw all</button>
      <label>Speed
        <input type="range" id="speedInput" min="1" max="300" value="40" style="width:110px">
        <span id="speedLabel">40</span>/s
      </label>
      <span class="mono" id="readout"></span>
    </div>

    <div class="row">
      <label>Mode
        <select id="modeSelect">
          <option value="position">Position (stick = pen location)</option>
          <option value="velocity">Velocity (stick = pen speed)</option>
        </select>
      </label>
      <label>Pen
        <select id="penSelect">
          <option value="right">Right stick</option>
          <option value="left">Left stick</option>
          <option value="both">Both</option>
        </select>
      </label>
      <label>Range ±<input type="number" id="rangeInput" value="500" min="1"></label>
      <label><input type="checkbox" id="invertY" checked> invert Y (up = +)</label>
    </div>
  </div>

  <!-- ===== Live input sources ===== -->
  <div class="card">
    <label>Live source</label>
    <div class="row">
      <button id="serialBtn">🔌 Connect Serial</button>
      <label>baud <input type="number" id="baudInput" value="115200" style="width:90px"></label>
      <input type="text" id="wsUrlInput" value="ws://localhost:8080">
      <button id="wsBtn">Connect WebSocket</button>
      <button id="simBtn" class="secondary">Simulate</button>
      <button id="disconnectBtn" class="secondary">Disconnect</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>
    <div class="mono" id="status" style="margin-top:8px">
      Not connected. Each line "rx,ry,lx,ly" received is drawn immediately.
    </div>
  </div>

  <!-- ===== Offline input (paste / file) ===== -->
  <div class="card">
    <label for="pasteBox">Readings (one per line: rx,ry,lx,ly)</label>
    <textarea id="pasteBox" spellcheck="false"></textarea>
    <div class="row">
      <button id="loadBtn">Load</button>
      <button id="demoBtn" class="secondary">Demo (box + triangle)</button>
      <label class="secondary" style="cursor:pointer">
        📁 Open file <input type="file" id="fileInput" accept=".txt,.csv,.log" hidden>
      </label>
      <span class="mono" id="sampleCount"></span>
    </div>
  </div>
</main>

<script>
(() => {
  "use strict";

  // =====================================================================
  // Constants
  // =====================================================================
  const MAX_SAMPLES   = 20000;  // live mode keeps only the newest N readings
  const VELOCITY_GAIN = 0.04;   // how fast the pen moves in velocity mode
  const CANVAS_MARGIN = 20;     // pixels between canvas edge and drawing area
  const PEN_LINE_WIDTH = 3;
  const PEN_DOT_RADIUS = 8;

  // Each pen reads two columns from a sample [rx, ry, lx, ly].
  const PENS = {
    right: { xColumn: 0, colorVar: "--right-stick" },
    left:  { xColumn: 2, colorVar: "--left-stick"  },
  };

  // =====================================================================
  // State
  // =====================================================================
  let samples = [];                         // [[rx, ry, lx, ly], ...]
  let paths   = { right: [], left: [] };    // pen positions, one per sample
  let view    = null;                       // visible area: {minX, maxX, minY, maxY}
  let cursor  = 0;                          // index of the newest sample being drawn
  let playing = true;
  let isLive  = false;                      // true once live data (or Simulate) starts
  let redrawQueued = false;

  // Live connections
  let socket = null;
  let serialPort = null;
  let serialReader = null;
  let simulatorTimer = null;
  let lineBuffer = "";                      // partial line waiting for its newline

  // =====================================================================
  // DOM helpers
  // =====================================================================
  const $ = (id) => document.getElementById(id);
  const canvas = $("sketch");
  const ctx = canvas.getContext("2d");
  const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  const setStatus = (text) => { $("status").textContent = text; };

  // =====================================================================
  // Parsing
  // =====================================================================

  /** Turns "rx,ry,lx,ly" lines into [[rx, ry, lx, ly], ...]. Bad lines are skipped. */
  function parseReadings(text) {
    const result = [];
    for (const line of text.split(/\r?\n/)) {
      const numbers = line.match(/-?\d+(\.\d+)?/g);
      if (numbers && numbers.length >= 4) {
        result.push(numbers.slice(0, 4).map(Number));
      }
    }
    return result;
  }

  // =====================================================================
  // Building the pen paths from the samples
  // =====================================================================

  /**
   * Converts raw stick values into pen positions.
   *  - position mode: the stick value IS the pen position
   *  - velocity mode: the stick value is added to the pen position each sample
   * Positions are normalised so that the stick range maps to -1 .. +1.
   */
  function buildPaths() {
    const range      = Number($("rangeInput").value) || 500;
    const isVelocity = $("modeSelect").value === "velocity";
    const ySign      = $("invertY").checked ? 1 : -1;

    for (const [name, pen] of Object.entries(PENS)) {
      let x = 0, y = 0;
      paths[name] = samples.map((sample) => {
        const stickX = sample[pen.xColumn]     / range;
        const stickY = sample[pen.xColumn + 1] / range * ySign;
        if (isVelocity) {
          x += stickX * VELOCITY_GAIN;
          y += stickY * VELOCITY_GAIN;
        } else {
          x = stickX;
          y = stickY;
        }
        return [x, y];
      });
    }
    view = computeView(isVelocity);
  }

  /** Position mode uses a fixed -1..+1 box; velocity mode zooms to fit the drawing. */
  function computeView(isVelocity) {
    if (!isVelocity) return { minX: -1, maxX: 1, minY: -1, maxY: 1 };

    const points = activePens().flatMap((name) => paths[name]);
    if (points.length === 0) return { minX: -1, maxX: 1, minY: -1, maxY: 1 };

    const xs = points.map((p) => p[0]);
    const ys = points.map((p) => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);

    const half = Math.max(maxX - minX, maxY - minY, 0.1) * 0.6;  // square view with padding
    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;
    return { minX: centerX - half, maxX: centerX + half, minY: centerY - half, maxY: centerY + half };
  }

  /** Which pens are currently selected in the UI. */
  function activePens() {
    const choice = $("penSelect").value;
    return choice === "both" ? ["right", "left"] : [choice];
  }

  // =====================================================================
  // Drawing
  // =====================================================================

  const toCanvasX = (x) =>
    (x - view.minX) / (view.maxX - view.minX) * (canvas.width  - 2 * CANVAS_MARGIN) + CANVAS_MARGIN;
  const toCanvasY = (y) =>
    (y - view.minY) / (view.maxY - view.minY) * (canvas.height - 2 * CANVAS_MARGIN) + CANVAS_MARGIN;

  function drawGrid() {
    const w = canvas.width, h = canvas.height, m = CANVAS_MARGIN;
    ctx.strokeStyle = cssVar("--line");
    ctx.lineWidth = 1;
    ctx.strokeRect(m, m, w - 2 * m, h - 2 * m);
    ctx.beginPath();
    ctx.moveTo(w / 2, m);  ctx.lineTo(w / 2, h - m);   // vertical centre line
    ctx.moveTo(m, h / 2);  ctx.lineTo(w - m, h / 2);   // horizontal centre line
    ctx.stroke();
  }

  /** Draws the line from the first sample up to the cursor, plus a dot at the tip. */
  function drawPen(penName) {
    const path = paths[penName];
    if (path.length === 0) return;

    const color = cssVar(PENS[penName].colorVar);
    const last = Math.min(cursor, path.length - 1);

    ctx.strokeStyle = color;
    ctx.lineWidth = PEN_LINE_WIDTH;
    ctx.lineJoin = ctx.lineCap = "round";
    ctx.beginPath();
    for (let i = 0; i <= last; i++) {
      const [x, y] = path[i];
      if (i === 0) ctx.moveTo(toCanvasX(x), toCanvasY(y));
      else         ctx.lineTo(toCanvasX(x), toCanvasY(y));
    }
    ctx.stroke();

    const [tipX, tipY] = path[last];
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(toCanvasX(tipX), toCanvasY(tipY), PEN_DOT_RADIUS, 0, Math.PI * 2);
    ctx.fill();
  }

  function updateReadout() {
    const [rx, ry, lx, ly] = samples[cursor] || [0, 0, 0, 0];
    const shown = samples.length ? cursor + 1 : 0;
    $("readout").textContent = `${shown}/${samples.length}  rx=${rx} ry=${ry} lx=${lx} ly=${ly}`;
  }

  function redraw() {
    // The paths must always match the samples; rebuild if they got out of step.
    if (!view || paths.right.length !== samples.length || paths.left.length !== samples.length) {
      buildPaths();
    }
    cursor = Math.max(0, Math.min(cursor, samples.length - 1));

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    activePens().forEach(drawPen);
    updateReadout();
  }

  /** Coalesces many rapid live samples into at most one redraw per animation frame. */
  function requestRedraw() {
    if (redrawQueued) return;
    redrawQueued = true;
    requestAnimationFrame(() => {
      redrawQueued = false;
      buildPaths();
      redraw();
      $("sampleCount").textContent = `${samples.length} samples (live)`;
    });
  }

  // =====================================================================
  // Loading data
  // =====================================================================

  /** Replace everything with a recorded data set (paste, file, or demo). */
  function loadSamples(newSamples) {
    isLive = false;
    samples = newSamples;
    cursor = 0;
    buildPaths();
    $("sampleCount").textContent = `${samples.length} samples`;
    redraw();
  }

  /** Append readings that just arrived from a live source. */
  function addLiveSamples(newSamples) {
    if (!isLive) {          // first live reading: throw away any demo/recorded data
      isLive = true;
      samples = [];
    }
    samples = samples.concat(newSamples);
    if (samples.length > MAX_SAMPLES) samples = samples.slice(-MAX_SAMPLES);
    if (playing) cursor = samples.length - 1;   // follow the newest reading unless paused
    requestRedraw();
  }

  /** Demo: right stick draws a box, left stick draws a triangle. */
  function loadDemo() {
    const S = 394;
    const box      = [[S, S], [-S, S], [-S, -S], [S, -S], [S, S]];
    const triangle = [[0, S], [-S, -S], [S, -S], [0, S]];

    // Straight-line steps between consecutive corners.
    const interpolate = (corners, stepsPerSide) => {
      const points = [];
      for (let i = 0; i < corners.length - 1; i++) {
        for (let step = 0; step < stepsPerSide; step++) {
          const f = step / stepsPerSide;
          points.push([
            Math.round(corners[i][0] + (corners[i + 1][0] - corners[i][0]) * f),
            Math.round(corners[i][1] + (corners[i + 1][1] - corners[i][1]) * f),
          ]);
        }
      }
      return points;
    };

    const boxPoints      = interpolate(box, 25);
    const trianglePoints = interpolate(triangle, 33);
    const count = Math.max(boxPoints.length, trianglePoints.length);

    const demo = [];
    for (let i = 0; i < count; i++) {
      const [rx, ry] = boxPoints[Math.min(i, boxPoints.length - 1)];
      const [lx, ly] = trianglePoints[Math.min(i, trianglePoints.length - 1)];
      demo.push([rx, ry, lx, ly]);
    }
    $("pasteBox").value = demo.map((row) => row.join(",")).join("\n");
    loadSamples(demo);
  }

  // =====================================================================
  // Live sources: Serial, WebSocket, Simulator
  // =====================================================================

  /** Accepts raw text chunks (which may split lines in half) and emits complete lines. */
  function receiveText(chunk) {
    lineBuffer += chunk;
    const lines = lineBuffer.split(/\r?\n/);
    lineBuffer = lines.pop();                    // last piece may be incomplete
    const readings = parseReadings(lines.join("\n"));
    if (readings.length) addLiveSamples(readings);
  }

  async function connectSerial() {
    if (!navigator.serial) {
      setStatus("Web Serial is not available here. Use Chrome/Edge on a local file or localhost, or use WebSocket.");
      return;
    }
    try {
      serialPort = await navigator.serial.requestPort();
      await serialPort.open({ baudRate: Number($("baudInput").value) || 115200 });

      const decoder = new TextDecoderStream();
      serialPort.readable.pipeTo(decoder.writable);
      serialReader = decoder.readable.getReader();
      setStatus("Serial connected, waiting for data...");

      while (true) {
        const { value, done } = await serialReader.read();
        if (done) break;
        receiveText(value);
      }
    } catch (error) {
      setStatus("Serial: " + error.message);
    }
  }

  function connectWebSocket() {
    try {
      socket = new WebSocket($("wsUrlInput").value);
    } catch (error) {
      setStatus("WebSocket: " + error.message);
      return;
    }
    socket.onopen  = () => setStatus("WebSocket connected, waiting for data...");
    socket.onerror = () => setStatus("WebSocket error (is the server running and reachable?)");
    socket.onclose = () => setStatus("WebSocket closed");
    socket.onmessage = async (event) => {
      // Each message is treated as one or more complete lines.
      const text = typeof event.data === "string" ? event.data : await event.data.text();
      receiveText(text + "\n");
    };
  }

  /** Fake joystick data (30 Hz) so you can test the drawing without hardware. */
  function startSimulator() {
    disconnect();
    let t = 0;
    setStatus("Simulating live data (30 Hz)");
    simulatorTimer = setInterval(() => {
      t += 0.05;
      addLiveSamples([[
        Math.round(400 * Math.cos(t)),
        Math.round(400 * Math.sin(t)),
        Math.round(350 * Math.sin(2 * t)),
        Math.round(350 * Math.sin(3 * t + 1)),
      ]]);
    }, 33);
  }

  function disconnect() {
    if (socket)         { socket.close(); socket = null; }
    if (serialReader)   { serialReader.cancel().catch(() => {}); serialReader = null; }
    if (serialPort)     {
      const port = serialPort;
      serialPort = null;
      setTimeout(() => port.close().catch(() => {}), 100);   // let the reader release first
    }
    if (simulatorTimer) { clearInterval(simulatorTimer); simulatorTimer = null; }
    setStatus("Disconnected");
  }

  // Lets other scripts feed the page directly:  pushReading(rx, ry, lx, ly)
  window.pushReading = (rx, ry, lx, ly) => addLiveSamples([[rx, ry, lx, ly]]);

  // =====================================================================
  // Playback of recorded data
  // =====================================================================
  let lastFrameTime = performance.now();
  let pendingSteps = 0;   // fractional samples carried between frames

  function animationLoop(now) {
    const elapsedSeconds = (now - lastFrameTime) / 1000;
    lastFrameTime = now;

    const canAdvance = !isLive && playing && cursor < samples.length - 1;
    if (canAdvance) {
      pendingSteps += elapsedSeconds * Number($("speedInput").value);
      const wholeSteps = Math.floor(pendingSteps);
      pendingSteps -= wholeSteps;
      if (wholeSteps > 0) {
        cursor = Math.min(samples.length - 1, cursor + wholeSteps);
        redraw();
      }
    }
    requestAnimationFrame(animationLoop);
  }

  // =====================================================================
  // UI wiring
  // =====================================================================
  $("playBtn").onclick = () => {
    playing = !playing;
    $("playBtn").textContent = playing ? "Pause" : "Play";
    if (playing && isLive) { cursor = samples.length - 1; redraw(); }   // jump back to live
  };

  $("restartBtn").onclick = () => {
    isLive = false;
    playing = true;
    $("playBtn").textContent = "Pause";
    cursor = 0;
    redraw();
  };

  $("drawAllBtn").onclick = () => { cursor = samples.length - 1; redraw(); };

  $("speedInput").oninput = () => { $("speedLabel").textContent = $("speedInput").value; };

  $("loadBtn").onclick = () => loadSamples(parseReadings($("pasteBox").value));

  $("demoBtn").onclick = () => { disconnect(); loadDemo(); };

  $("fileInput").onchange = (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      $("pasteBox").value = reader.result;
      loadSamples(parseReadings(reader.result));
    };
    reader.readAsText(file);
  };

  $("serialBtn").onclick     = connectSerial;
  $("wsBtn").onclick         = connectWebSocket;
  $("simBtn").onclick        = startSimulator;
  $("disconnectBtn").onclick = disconnect;

  $("clearBtn").onclick = () => {
    samples = [];
    cursor = 0;
    isLive = true;          // keep following live data after clearing
    buildPaths();
    redraw();
    $("sampleCount").textContent = "cleared";
  };

  // Changing any drawing option rebuilds the paths and redraws.
  ["modeSelect", "penSelect", "rangeInput", "invertY"].forEach((id) => {
    $(id).onchange = () => { buildPaths(); redraw(); };
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);

  // =====================================================================
  // Start
  // =====================================================================
  loadDemo();
  requestAnimationFrame(animationLoop);
})();
</script>
</body>
</html>
